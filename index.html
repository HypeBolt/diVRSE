<!DOCTYPE html> <html lang="en">
    <head>
        <title>VRSE</title>
        <link rel="icon" href="https://vrse.ca/img/vrse.ico">

        <style>
            * {
                padding: 0;
                margin: 0;
            }
            body {
                background-color: black;
                display: flex;
                flex-direction: column;
                height: 100vh;
                width: 100%;
            }
            main {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .logo {
                width: 240px;
            }
            .logo img {
                width: 100%;
            }
        </style>

        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <main>
            <div class="logo">
                <img alt="VRSE Logo, red" src="https://vrse.ca/img/VRSE-red.png">
            </div>
        </main>
    </body>
</html>
